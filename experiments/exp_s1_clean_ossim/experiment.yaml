# exp_s1 clean.ossim phase descriptor (Slice A.5).
#
# Runs `cpu_loop` in N microbench VMs with ossim sync enabled
# system-wide. Driver flow is implemented by run_exp.sh's
# multi_vm_barrier mode: spawn VMs in background (no tmux, no
# user-net), guest auto-runs /out/start_bench.sh on autologin (via
# the .bash_profile hook installed by
# workloads/disks/microbench/install.sh), guests write ready markers
# to /out/ready_vm-N, runner waits for all markers, calls
# `ossimctl enable-sync`, releases barriers, waits for results.
#
# IMPORTANT: the microbench guest image must include the autologin
# auto-run hook for /out/start_bench.sh. Rebuild the image once with:
#
#   make -C workloads dimg-microbench
#
# After that, every clean.ossim run uses the same image.
#
# See clawspace/experiment-automation-design-draft-2026-05-11.md for
# the runner contract and Discord design discussion (2026-05-11) for
# the Path-A (no user-net, guest-autorun) decision.

schema_version: "1.0"
name: exp_s1_clean_ossim
phase: clean.ossim
mode: multi_vm_barrier

multi_vm:
  n_vms: 2
  cpusets:
    - "0-1"            # vm-0 pinned to host CPUs 0-1
    - "2-3"            # vm-1 pinned to host CPUs 2-3
  bench_label: clean_ossim
  result_filename: cpu_clean_ossim.json
  time_s: 10
  sample_ms: 100
  inner: 100000
  ossim_sync: true
  vtime_epoch_ns: 10000000   # 10ms, matches OSSIM_QEMU_DEFAULT_VTIME_EPOCH_NS
  ready_timeout_sec: 300

# --- success criteria ---
success_criteria:
  benchmark_eq: cpu_loop
  samples_min: 1

# --- workload provenance (hashed by preflight, recorded in manifest) ---
workload:
  provenance_files:
    - workloads/scripts/experiments/common.sh
    - workloads/host_microbench/bench_cpu.py
    - workloads/host_microbench/run_in_vm.sh
    - workloads/host_microbench/lib_results.py
    - workloads/host_microbench/cpu_loop/cpu_loop
    - workloads/host_microbench/cpu_loop/main.c
    - workloads/disks/microbench/install.sh
    - workloads/disks/microbench/rules.mk

# --- timing / timeout ---
expected_runtime_sec: 180
timeout_policy:
  preflight_sec: 60
  build_deploy_sec: 1800
  run_collect_sec: 600

# --- disconnect policy (Slice A.5 is single-shot; no reboots expected) ---
disconnect_policy:
  preflight: { expected: false }
  build_deploy: { expected: false }
  run_collect: { expected: false }
